version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agritrace_db
    restart: always
    environment:
      POSTGRES_USER: agritrace
      POSTGRES_PASSWORD: agritrace_secret_pass
      POSTGRES_DB: agritrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agritrace -d agritrace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agritrace_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://agritrace:agritrace_secret_pass@db:5432/agritrace_db
      - SECRET_KEY=super_secret_jwt_key_change_in_production_32bytes_min
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agritrace_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  postgres_data:
